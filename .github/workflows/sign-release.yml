# BUG-158 (CONTROL ruling B, 2026-10-27): QGS releases are signed keyless here. This repo holds only this workflow: no
# code, no key. A dispatch names one release file and its sha256; GitHub's OIDC identity for this workflow on main gets
# a short-lived Sigstore certificate (public good, logged in Rekor) and signs an in-toto statement whose one subject is
# that file at that digest. QGS installs pin this repo, this workflow, refs/heads/main, the GitHub issuer, a
# GitHub-hosted runner and the predicate type below (qgs-client scripts/lib/keyless.js), so main and the right to
# dispatch ARE the signing authority: main is protected, and only the release seat's account may dispatch.
name: sign-release
run-name: sign ${{ inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: The release file name the statement signs (qgs-<version>.zip or qgs-release-list-<version>.json)
        required: true
      sha256:
        description: The file's sha256, 64 lower-case hex characters
        required: true

permissions: {}

jobs:
  sign:
    if: github.ref == 'refs/heads/main' && github.triggering_actor == 'nordeski-admin'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Check the dispatch
        env:
          NAME: ${{ inputs.name }}
          SHA: ${{ inputs.sha256 }}
        run: |
          [[ "$NAME" =~ ^qgs-[0-9]+\.[0-9]+\.[0-9]+\.zip$ || "$NAME" =~ ^qgs-release-list-[0-9]+\.[0-9]+\.[0-9]+\.json$ ]] || { echo "refused: $NAME is not a QGS release file name"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "refused: the sha256 is not 64 lower-case hex characters"; exit 1; }
          jq -n --arg name "$NAME" --arg sha "$SHA" '{name: $name, sha256: $sha}' > predicate.json
      - name: Sign
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.name }}
          subject-digest: sha256:${{ inputs.sha256 }}
          predicate-type: https://nordeski.com/qgs-release/v1
          predicate-path: predicate.json
          create-storage-record: false
      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
